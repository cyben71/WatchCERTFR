---
feed:
- name: avis
  url: http://www.cert.ssi.gouv.fr/avis
- name: alerte
  url: https://www.cert.ssi.gouv.fr/alerte

# watch CERT-FR alerts for these programs
watch_list: [ubuntu, sap, openssh, openssl, edge]

# excluded alerts and notices (already fixed or without impact for Datakkod)
exclude: [CERTFR-2022-ALE-014, CERTFR-2023-ALE-002]

# smtp settings
smtp:
    host: 'smtp.gmail.com'
    port: 587
    user: 'login_gmail'
    password: 'xxx'
    isTls: True

# Alert email
email:
    from: 'adresse_expediteur'
    to: ['cyben71 <adresse_destinataire>', other-man <adresse_destinataire_2>]
    subject: "[CERTFR] - Surveillance des avis et alertes"
    body: "Ceci est le résultat du dernier scan des flux RSS du CertFR. Vérifier les avis et alertes en pièces jointe."
